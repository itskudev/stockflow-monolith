<header class="barra">
  <a class="marca" routerLink="/">StockFlow</a>
  <nav class="menu">
    @for (enlace of enlaces(); track enlace.ruta) {
      <a
        [routerLink]="enlace.ruta"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: enlace.ruta === '/' }"
      >
        {{ enlace.etiqueta }}
      </a>
    }
  </nav>
  <div class="sesion">
    <span class="sesion-datos">{{ sesion()?.nombre }} · {{ sesion()?.rol }}</span>
    <button type="button" class="btn btn-salir" (click)="salir()">Salir</button>
  </div>
</header>

<main class="contenido">
  <router-outlet />
</main>
