<form class="tarjeta login" [formGroup]="form" (ngSubmit)="enviar()">
  <h1>Iniciar sesión</h1>

  @if (errorGeneral()) {
    <app-mensaje tipo="error" [texto]="errorGeneral()" />
  }

  <div class="campo">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="admin@stockflow.com"
    />
    @if (mostrarError('email'); as error) {
      <span class="error-campo">{{ error }}</span>
    }
  </div>

  <div class="campo">
    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (mostrarError('password'); as error) {
      <span class="error-campo">{{ error }}</span>
    }
  </div>

  <button class="btn btn-primario" type="submit" [disabled]="cargando()">
    {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
  </button>
</form>
